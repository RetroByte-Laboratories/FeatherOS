name: Build FeatherOS ISO

on:
  workflow_dispatch:
    inputs:
      slim_build:
        description: "Slim build (omit LibreOffice / GIMP / Thunderbird)"
        type: boolean
        default: false
      run_smoke_test:
        description: "Boot-test the ISO in QEMU and upload screenshots"
        type: boolean
        default: true
      publish_release:
        description: "Publish a GitHub release with the ISO"
        type: boolean
        default: true
      test_existing_release:
        description: "Download and QEMU-test a published ISO instead of rebuilding"
        type: boolean
        default: false
      release_tag:
        description: "Published release tag to test"
        type: string
        required: false
        default: "v6.1-eiderdown-rebuild-5260d4c"
  push:
    tags: ["v*"]

concurrency:
  group: build-iso
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build FeatherOS 6.1 ISO (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build options
        env:
          INPUT_SLIM_BUILD: ${{ inputs.slim_build }}
          INPUT_RUN_SMOKE: ${{ inputs.run_smoke_test }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_TEST_RELEASE: ${{ inputs.test_existing_release }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_TEST_RELEASE" = "true" ] && [[ ! "$INPUT_RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid release_tag: use only letters, digits, dot, underscore, and hyphen." >&2
              exit 1
            fi
            echo "SLIM_BUILD=$INPUT_SLIM_BUILD" >> "$GITHUB_ENV"
            echo "RUN_SMOKE=$INPUT_RUN_SMOKE" >> "$GITHUB_ENV"
            echo "PUBLISH_RELEASE=$INPUT_PUBLISH_RELEASE" >> "$GITHUB_ENV"
            echo "TEST_RELEASE=$INPUT_TEST_RELEASE" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$INPUT_RELEASE_TAG" >> "$GITHUB_ENV"
          else
            echo "SLIM_BUILD=false" >> "$GITHUB_ENV"
            echo "RUN_SMOKE=true" >> "$GITHUB_ENV"
            echo "PUBLISH_RELEASE=true" >> "$GITHUB_ENV"
            echo "TEST_RELEASE=false" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
          fi

      - name: Free disk space (runner images carry ~25GB of SDKs)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/share/mysql /usr/lib/jvm /usr/share/miniconda \
            /usr/share/gradle-* /usr/share/apache-maven-* /usr/share/sbt || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          echo "=== disk after cleanup ===" && df -h / /mnt 2>/dev/null || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools mtools imagemagick \
            qemu-system-x86 ovmf

      - name: Download and verify published ISO
        if: env.TEST_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source build/config.sh
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ISO_NAME.part-*" \
            --pattern SHA256SUMS \
            --dir "$release_dir"
          mkdir -p "$GITHUB_WORKSPACE/out"
          (
            cd "$release_dir"
            sha256sum -c SHA256SUMS
            cat "$ISO_NAME".part-* > "$GITHUB_WORKSPACE/out/$ISO_NAME"
          )
          printf 'FeatherOS %s (%s)\nstatus: downloaded and checksum-verified for QEMU smoke test\n' \
            "$FEATHER_VERSION" "$FEATHER_CODENAME" > out/build-info.txt

      - name: Restore base ISO cache
        if: env.TEST_RELEASE != 'true'
        uses: actions/cache@v4
        with:
          path: /mnt/base-iso-cache
          key: base-iso-ubuntu-22.04.5-desktop-amd64-v1

      - name: Build FeatherOS ISO
        if: env.TEST_RELEASE != 'true'
        run: |
          set -o pipefail
          sudo env SLIM_BUILD="$SLIM_BUILD" \
            FEATHER_BASE_ISO=/mnt/base-iso-cache/ubuntu-22.04.5-desktop-amd64.iso \
            bash build/build.sh all 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Surface build failure details
        if: failure() && env.TEST_RELEASE != 'true'
        shell: bash
        run: |
          if [ -f build.log ]; then
            {
              echo '### Build log tail'
              echo
              echo '```text'
              tr '\r' '\n' < build.log | tail -n 80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostics="$(tr '\r' '\n' < build.log | grep -Ei 'error|failed|lightdm-gtk-greeter|dpkg|zsys|invoke-rc|systemctl|dbus' | tail -n 40 || true)"
            if [ -z "$diagnostics" ]; then
              diagnostics="$(tr '\r' '\n' < build.log | tail -n 80)"
            fi
            message="$(printf '%s' "$diagnostics" | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Build diagnostics::${message}"
          else
            echo '### Build failed before producing build.log' >> "$GITHUB_STEP_SUMMARY"
            echo '::error title=Build log missing::No build.log was produced.'
          fi

      # Keep logs as workflow artifacts. Avoid committing them back to a
      # hard-coded branch or changing the checkout used by later steps.
      - name: Smoke test (QEMU boot, BIOS + UEFI)
        if: env.RUN_SMOKE == 'true'
        run: |
          sudo env SMOKE_SECS_BIOS=660 SMOKE_SECS_UEFI=420 bash build/smoke-test.sh
          sudo chown -R "$(id -u):$(id -g)" out/ || true

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: out/smoke/
          if-no-files-found: ignore

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            out/build-info.txt
            out/RELEASE_NOTES.md
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: env.PUBLISH_RELEASE == 'true' && env.TEST_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/publish-release.sh
