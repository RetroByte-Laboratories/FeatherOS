name: Build FeatherOS ISO

on:
  workflow_dispatch:
    inputs:
      slim_build:
        description: "Slim build (omit LibreOffice / GIMP / Thunderbird)"
        type: boolean
        default: false
      run_smoke_test:
        description: "Boot-test the ISO in QEMU and upload screenshots"
        type: boolean
        default: true
      publish_release:
        description: "Publish a GitHub release with the ISO"
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: build-iso
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build FeatherOS 6.1 ISO (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build options
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SLIM_BUILD=${{ inputs.slim_build }}" >> "$GITHUB_ENV"
            echo "RUN_SMOKE=${{ inputs.run_smoke_test }}" >> "$GITHUB_ENV"
            echo "PUBLISH_RELEASE=${{ inputs.publish_release }}" >> "$GITHUB_ENV"
          else
            echo "SLIM_BUILD=false" >> "$GITHUB_ENV"
            echo "RUN_SMOKE=true" >> "$GITHUB_ENV"
            echo "PUBLISH_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools mtools imagemagick \
            qemu-system-x86 ovmf

      - name: Build FeatherOS ISO
        run: |
          sudo env SLIM_BUILD="$SLIM_BUILD" bash build/build.sh all

      - name: Smoke test (QEMU boot, BIOS + UEFI)
        if: env.RUN_SMOKE == 'true'
        continue-on-error: true
        run: |
          sudo env SMOKE_SECS_BIOS=660 SMOKE_SECS_UEFI=420 bash build/smoke-test.sh
          sudo chown -R "$(id -u):$(id -g)" out/ || true

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: out/smoke/
          if-no-files-found: ignore

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            out/build-info.txt
            out/RELEASE_NOTES.md
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/publish-release.sh
