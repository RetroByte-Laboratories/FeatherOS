name: Build FeatherOS ISO

on:
  workflow_dispatch:
    inputs:
      slim_build:
        description: "Slim build (omit LibreOffice / GIMP / Thunderbird)"
        type: boolean
        default: false
      run_smoke_test:
        description: "Boot-test the ISO in QEMU and upload screenshots"
        type: boolean
        default: true
      publish_release:
        description: "Publish a GitHub release with the ISO"
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: build-iso
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build FeatherOS 6.1 ISO (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build options
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SLIM_BUILD=${{ inputs.slim_build }}" >> "$GITHUB_ENV"
            echo "RUN_SMOKE=${{ inputs.run_smoke_test }}" >> "$GITHUB_ENV"
            echo "PUBLISH_RELEASE=${{ inputs.publish_release }}" >> "$GITHUB_ENV"
          else
            echo "SLIM_BUILD=false" >> "$GITHUB_ENV"
            echo "RUN_SMOKE=true" >> "$GITHUB_ENV"
            echo "PUBLISH_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Free disk space (runner images carry ~25GB of SDKs)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/share/mysql /usr/lib/jvm /usr/share/miniconda \
            /usr/share/gradle-* /usr/share/apache-maven-* /usr/share/sbt || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          echo "=== disk after cleanup ===" && df -h / /mnt 2>/dev/null || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools mtools imagemagick \
            qemu-system-x86 ovmf

      - name: Restore base ISO cache
        uses: actions/cache@v4
        with:
          path: /mnt/base-iso-cache
          key: base-iso-ubuntu-22.04.5-desktop-amd64-v1

      - name: Build FeatherOS ISO
        run: |
          set -o pipefail
          sudo env SLIM_BUILD="$SLIM_BUILD" \
            FEATHER_BASE_ISO=/mnt/base-iso-cache/ubuntu-22.04.5-desktop-amd64.iso \
            bash build/build.sh all 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Surface build failure details
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            {
              echo '### Build log tail'
              echo
              echo '```text'
              tr '\r' '\n' < build.log | tail -n 80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostics="$(tr '\r' '\n' < build.log | grep -Ei 'error|failed|lightdm-gtk-greeter|dpkg|zsys|invoke-rc|systemctl|dbus' | tail -n 40 || true)"
            if [ -z "$diagnostics" ]; then
              diagnostics="$(tr '\r' '\n' < build.log | tail -n 80)"
            fi
            message="$(printf '%s' "$diagnostics" | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Build diagnostics::${message}"
          else
            echo '### Build failed before producing build.log' >> "$GITHUB_STEP_SUMMARY"
            echo '::error title=Build log missing::No build.log was produced.'
          fi

      # Keep logs as workflow artifacts. Avoid committing them back to a
      # hard-coded branch or changing the checkout used by later steps.
      - name: Smoke test (QEMU boot, BIOS + UEFI)
        if: env.RUN_SMOKE == 'true'
        continue-on-error: true
        run: |
          sudo env SMOKE_SECS_BIOS=660 SMOKE_SECS_UEFI=420 bash build/smoke-test.sh
          sudo chown -R "$(id -u):$(id -g)" out/ || true

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: out/smoke/
          if-no-files-found: ignore

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            out/build-info.txt
            out/RELEASE_NOTES.md
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/publish-release.sh
